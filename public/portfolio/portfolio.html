<style>
  html, body {
  zoom: 60%;  /* يقلل كل شي 50% */
  transform-origin: top left;
}
:root{
  --page-w:1920px;
  --page-h:1080px;
  --accent:#C8102E;      /* brand red – matches NOTTINGHAM */
  --brand-red:#981d16;   /* for hero compatibility */
  --brand-gray:#545454;
  --light-bg:#f8f8f8;
  --font-family:"Helvetica Neue", Arial, 'Inter', sans-serif;
}
html,body{
  margin:0;
  padding:0;
  background:#f6f6f6;
  font-family:var(--font-family);
  color:#111;
}
.paper{
  width:var(--page-w);
  height:var(--page-h);
  margin:20px auto;
  background:#fff;
  position:relative;
  overflow:hidden;
  page-break-after:always;
}

/* ===== NOTTINGHAM HERO SECTION – adapted for 1920×1080 ===== */
.hero-section {
  height: 1080px;            /* full paper height */
  width: 100%;
  background: white;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
}
.hero-section .container,
.hero-section .container-fluid {
  max-width: 100%;
  width: 100%;
  padding-left: 5rem;
  padding-right: 5rem;
}
.hero-pattern {
  position: absolute;
  inset: 0;
  opacity: 0.09;
  background-image: 
    linear-gradient(var(--brand-red) 1px, transparent 1px),
    linear-gradient(90deg, var(--brand-red) 1px, transparent 1px);
  background-size: 120px 120px;
  z-index: 1;
}
.hero-content {
  position: relative;
  z-index: 10;
  width: 100%;
}
.hero-logo {
 /* width: 112px;
  height: 112px;*/
  object-fit: contain;
  margin-bottom: 1.5rem;
}
.hero-title {
  font-size: 4rem;          /* slightly larger for 1920 */
  font-weight: 700;
  color: var(--brand-red);
  line-height: 1.2;
  margin-bottom: 1rem;
}
.hero-divider {
  width: 96px;
  height: 6px;
  background: var(--brand-red);
  margin: 1rem 0;
}
.hero-subtitle {
  font-size: 2.25rem;
  color: var(--brand-gray);
  font-weight: 300;
  line-height: 1.4;
  margin-bottom: 1.5rem;
}
.hero-description {
  font-size: 1.25rem;
  color: rgba(84, 84, 84, 0.8);
  line-height: 1.75;
  max-width: 42rem;
  margin-bottom: 1.5rem;
}
.stats-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
  padding-top: 1.5rem;
}
.stat-item {
  border-left: 4px solid var(--brand-red);
  padding-left: 1rem;
}
.stat-number {
  font-size: 2.25rem;
  font-weight: 700;
  color: var(--brand-red);
}
.stat-label {
  font-size: 1rem;
  color: var(--brand-gray);
  margin-top: 0.25rem;
}
.hero-buttons {
  display: flex;
  gap: 1rem;
  padding-top: 1rem;
}
.btn-primary-custom {
  padding: 0.75rem 2rem;
  background: var(--brand-red);
  color: white;
  border: none;
  border-radius: 0.5rem;
  font-weight: 500;
  transition: all 0.3s;
  box-shadow: 0 10px 15px -3px rgba(152, 29, 22, 0.3);
}
.btn-outline-custom {
  padding: 0.75rem 2rem;
  background: transparent;
  color: var(--brand-red);
  border: 2px solid var(--brand-red);
  border-radius: 0.5rem;
  font-weight: 500;
  transition: all 0.3s;
}
.btn-primary-custom:hover,
.btn-outline-custom:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 25px -5px rgba(152, 29, 22, 0.4);
}
.hero-image-container {
  position: relative;
}
.hero-building-image {
  width: 100%;
  height: 600px;           /* balanced for 1080 height */
  object-fit: cover;
  border-radius: 1.5rem;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
}
.hero-badge {
  position: absolute;
  bottom: -1.5rem;
  left: 9.5rem;
  background: white;
  padding: 1.25rem;
  border-radius: 1rem;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  border-left: 4px solid var(--brand-red);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.badge-icon {
  width: 40px;
  height: 40px;
  background: var(--brand-red);
  border-radius: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.badge-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--brand-red);
}
.badge-subtitle {
  font-size: 0.875rem;
  color: var(--brand-gray);
}
.scroll-indicator {
  position: absolute;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  animation: bounce 2s infinite;
}
.scroll-mouse {
  width: 24px;
  height: 40px;
  border: 2px solid var(--brand-red);
  border-radius: 20px;
  display: flex;
  justify-content: center;
}
.scroll-wheel {
  width: 6px;
  height: 12px;
  background: var(--brand-red);
  border-radius: 3px;
  margin-top: 8px;
}
@keyframes bounce {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-10px); }
}

.mission-section, .vision-section{ margin-bottom:50px; }
.mission-title, .vision-title{ font-size:32px; font-weight:600; margin:0 0 20px 0; color:var(--accent); }
.mission-text, .vision-text{ font-size:20px; line-height:1.6; color:#333; margin:0; }
.stats-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:40px; margin-top:60px; }
.stat-item{ text-align:center; }
.stat-number{  font-weight:1200; line-height:1; color:var(--accent); margin:0 0 10px 0; }
.stat-label{ font-size:18px; color:#666; text-transform:uppercase; letter-spacing:1px; font-weight:400; }
.right-content{ padding-top:40px; }
.right-title{ font-size:32px; font-weight:600; margin:0 0 30px 0; color:#111; }
.right-description{ font-size:20px; line-height:1.7; color:#333; margin:0 0 40px 0; }
.values-list{ list-style:none; padding:0; margin:0 0 40px 0; }
.values-list li{ font-size:20px; line-height:1.8; color:#333; margin-bottom:15px; padding-left:25px; position:relative; }
.values-list li:before{ content:"•"; color:var(--accent); font-size:30px; position:absolute; left:0; top:-5px; }
.services-container { display: flex; gap: 60px; margin-top: 40px; }
.what-we-do-section { flex: 1; }
.markets-section { flex: 1; }
.detail{ display:flex; flex-direction:column; height:100%; padding:60px; box-sizing:border-box; }
.project-header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:30px; border-bottom:2px solid var(--accent); padding-bottom:20px; }
.project-title-large{ font-size:48px; font-weight:300; margin:0; color:#111; text-transform:uppercase; }
.project-subtitle{ color:#666; font-size:22px; }
.images-row{ display:flex; gap:30px; flex:1; margin-bottom:30px; }
.main-thumb{ flex:3; background-size:100% 100%; background-position:center; background-repeat:no-repeat; background-color:#000; border-radius:8px; overflow:hidden; }
/*.side-col{ flex:1; display:flex; flex-direction:column; gap:30px; }*/
.thumb{ flex:1; background-size:100% 100%; background-position:center; background-repeat:no-repeat; background-color:#000; border-radius:8px; overflow:hidden; }
.meta-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:30px; margin-top:40px; padding-top:30px; border-top:1px solid #eee; }
.meta-box{ padding:20px; background:var(--light-bg); border-radius:8px; }
.meta-label{ font-size:16px; color:#666; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
.meta-value{ font-size:22px; font-weight:600; color:#111; display:inline-block; border-bottom:2px solid var(--accent); padding-bottom:3px; }
.client-page{ padding:80px 60px; box-sizing:border-box; }
.client-title{ font-size:48px; font-weight:800; margin:0 0 20px 0; color: #981d16; text-transform:uppercase; }
.client-subtitle{ font-size:22px; color:#666; margin-bottom:30px; }
.client-grid{ display:grid; grid-template-columns:repeat(11, 1fr); gap:15px; max-width:1800px; }
.client-logo{ height:140px; display:flex; align-items:center; justify-content:center; border:2px solid #eee; background:#fafafa; border-radius:12px; transition:all 0.3s ease; }
.client-logo:hover{ border-color:var(--accent); transform:translateY(-5px); }
.client-logo svg{ width:100px; height:auto; fill:#444; }
@media print{
